security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                # No "property": UserRepository::loadUserByIdentifier() normalizes the email.
                class: App\Entity\User

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: email
                password_parameter: password
                enable_csrf: true
                csrf_token_id: authenticate
                default_target_path: app_dashboard
            login_throttling:
                max_attempts: 5
                interval: '1 minute'
            logout:
                path: app_logout
                target: app_login
                enable_csrf: true
                csrf_token_id: logout
                csrf_parameter: _csrf_token

    # Only the first matching rule applies. Everything except the public pages needs a signed-in user
    # (anonymous → redirect to sign in). Data isolation per account is enforced in every query
    # (owner-scoped repositories: another account's id is simply "not found").
    access_control:
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/(login|register|demo(/|$)|healthz$), roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
